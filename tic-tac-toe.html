<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graph Paper Tic-Tac-Toe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: one centered notebook sheet — scoreboard, board drawn in pencil, controls below */
  :root {
    --paper: #f6f8f4;
    --grid: #d3e0e6;
    --ink: #1f2b3a;
    --muted: #5d6b78;
    --x: #c2410c;
    --o: #1d4ed8;
    --win: #f5d74a;
    --line: #34404e;
    --chip: #e8eef0;
    --font-hand: "Kalam", "Comic Sans MS", "Segoe Print", cursive;
    --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #141b22; --grid: #233240; --ink: #e6edf2; --muted: #93a3b1;
      --x: #fb923c; --o: #7aa7ff; --win: #6b5a12; --line: #c9d4dd; --chip: #1d2731;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #141b22; --grid: #233240; --ink: #e6edf2; --muted: #93a3b1;
    --x: #fb923c; --o: #7aa7ff; --win: #6b5a12; --line: #c9d4dd; --chip: #1d2731;
    color-scheme: dark;
  }

  html, body { min-height: 100%; }
  body {
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
    color: var(--ink);
    font-family: var(--font-mono);
    padding: 0 16px;
  }
  main {
    max-width: 440px;
    margin: 0 auto;
    padding-block: 32px 40px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  h1 {
    font-family: var(--font-hand);
    font-weight: 700;
    font-size: 2.4rem;
    line-height: 1;
    margin: 0;
    text-wrap: balance;
    transform: rotate(-1.5deg);
  }
  .modes {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .modes button, .actions button {
    font: 500 0.8rem/1 var(--font-mono);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink);
    background: var(--chip);
    border: 1.5px solid var(--line);
    border-radius: 999px;
    padding: 9px 14px;
    cursor: pointer;
  }
  .modes button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  button:focus-visible, .cell:focus-visible { outline: 3px solid var(--o); outline-offset: 3px; }

  .score {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    font-variant-numeric: tabular-nums;
  }
  .score div { display: flex; flex-direction: column; gap: 2px; }
  .score .label { font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .score .val { font-family: var(--font-hand); font-size: 1.8rem; line-height: 1; }
  .score .x .val { color: var(--x); }
  .score .o .val { color: var(--o); }
  .score .active .label { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }

  .board-wrap { position: relative; width: 100%; max-width: 100%; aspect-ratio: 1; }
  .board {
    position: absolute; inset: 0;
    display: grid;
    grid-template: repeat(3, 1fr) / repeat(3, 1fr);
  }
  .grid-lines, .strike { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .grid-lines path { stroke: var(--line); stroke-width: 2.2; fill: none; stroke-linecap: round; }
  .cell {
    background: transparent;
    border: 0;
    padding: 14%;
    cursor: pointer;
    transition: background-color 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .cell:disabled { cursor: default; }
  @media (hover: hover) {
    .cell:not(:disabled):hover { background: color-mix(in srgb, var(--grid) 45%, transparent); }
  }
  .cell.win { background: color-mix(in srgb, var(--win) 55%, transparent); }
  .cell svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .cell path, .cell circle { fill: none; stroke-width: 9; stroke-linecap: round; }
  .cell .mx { stroke: var(--x); }
  .cell .mo { stroke: var(--o); }
  .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 0.28s ease-out forwards; }
  .draw.d2 { animation-delay: 0.14s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .strike line { stroke: var(--ink); stroke-width: 6; stroke-linecap: round; opacity: 0.85; }

  .status {
    font-family: var(--font-hand);
    font-size: 1.5rem;
    min-height: 2.2rem;
    margin: 0;
  }
  .status .x { color: var(--x); }
  .status .o { color: var(--o); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .actions .primary { background: var(--ink); color: var(--paper); }
  .hint { font-size: 0.75rem; color: var(--muted); margin: 0; }

  @media (prefers-reduced-motion: reduce) {
    .draw { animation: none; stroke-dashoffset: 0; }
  }
</style>

</head>
<body>
<main>
  <h1>Tic-Tac-Toe</h1>

  <div class="modes" role="group" aria-label="Opponent">
    <button id="mode-cpu" type="button" aria-pressed="true">Vs computer</button>
    <button id="mode-pvp" type="button" aria-pressed="false">Two players</button>
    <button id="mode-hard" type="button" aria-pressed="false" title="The computer never loses">Unbeatable</button>
  </div>

  <div class="score" aria-live="polite">
    <div class="x" id="sx"><span class="label" id="lx">You (X)</span><span class="val" id="vx">0</span></div>
    <div><span class="label">Draws</span><span class="val" id="vd">0</span></div>
    <div class="o" id="so"><span class="label" id="lo">Computer (O)</span><span class="val" id="vo">0</span></div>
  </div>

  <div class="board-wrap">
    <svg class="grid-lines" viewBox="0 0 300 300" preserveAspectRatio="none" aria-hidden="true">
      <path d="M101 6 C 99 90, 102 200, 100 294"/>
      <path d="M200 5 C 202 100, 198 210, 201 295"/>
      <path d="M6 100 C 90 102, 210 98, 294 101"/>
      <path d="M5 199 C 100 201, 200 197, 295 200"/>
    </svg>
    <div class="board" id="board" role="grid" aria-label="Board"></div>
    <svg class="strike" id="strike" viewBox="0 0 300 300" aria-hidden="true"></svg>
  </div>

  <p class="status" id="status" aria-live="polite"></p>

  <div class="actions">
    <button id="again" class="primary" type="button">New round</button>
    <button id="reset" type="button">Reset score</button>
  </div>
  <p class="hint">X always opens the first round; the loser of each round starts the next. Keys 1–9 play the squares like a phone keypad.</p>
</main>

<script>
(() => {
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const strikeEl = document.getElementById('strike');
  const modeBtns = { cpu: document.getElementById('mode-cpu'), pvp: document.getElementById('mode-pvp'), hard: document.getElementById('mode-hard') };

  let S;
  const fresh = () => ({ mode: 'cpu', board: Array(9).fill(null), turn: 'X', starter: 'X', over: false, score: { X: 0, O: 0, D: 0 } });

  const cells = [];
  for (let i = 0; i < 9; i++) {
    const b = document.createElement('button');
    b.className = 'cell'; b.type = 'button'; b.id = 'cell-' + i;
    b.addEventListener('click', () => play(i, true));
    boardEl.appendChild(b); cells.push(b);
  }

  const winner = (bd) => {
    for (const l of LINES) { const [a,b,c] = l; if (bd[a] && bd[a] === bd[b] && bd[a] === bd[c]) return { p: bd[a], line: l }; }
    return bd.every(Boolean) ? { p: 'D' } : null;
  };

  const markSVG = (p, animate) => {
    const d = animate ? ' draw' : '';
    return p === 'X'
      ? `<svg viewBox="0 0 100 100"><path class="mx${d}" pathLength="1" d="M15 14 C 40 40, 62 62, 86 87"/><path class="mx${d} d2" pathLength="1" d="M85 15 C 60 38, 38 64, 14 86"/></svg>`
      : `<svg viewBox="0 0 100 100"><path class="mo${d}" pathLength="1" d="M52 12 C 20 10, 10 40, 14 60 C 20 88, 70 92, 85 66 C 96 44, 82 14, 48 16"/></svg>`;
  };

  const cpuActive = () => S.mode !== 'pvp';
  const isCpuTurn = () => cpuActive() && S.turn === 'O' && !S.over;

  function render(animIdx = -1) {
    const w = winner(S.board);
    cells.forEach((c, i) => {
      const p = S.board[i];
      if (i === animIdx || (!p && c.dataset.p) || (p && c.dataset.p !== p)) {
        c.innerHTML = p ? markSVG(p, i === animIdx) : '';
        c.dataset.p = p || '';
      }
      c.disabled = !!p || S.over || isCpuTurn();
      c.classList.toggle('win', !!(w && w.line && w.line.includes(i)));
      c.setAttribute('aria-label', `Square ${i + 1}: ${p || 'empty'}`);
    });

    strikeEl.innerHTML = '';
    if (w && w.line) {
      const pt = (i) => [50 + (i % 3) * 100, 50 + Math.floor(i / 3) * 100];
      const [a, , c] = w.line; const [x1, y1] = pt(a), [x2, y2] = pt(c);
      const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy), ext = 34;
      strikeEl.innerHTML = `<line x1="${x1 - dx / len * ext}" y1="${y1 - dy / len * ext}" x2="${x2 + dx / len * ext}" y2="${y2 + dy / len * ext}"/>`;
    }

    const names = cpuActive() ? { X: 'You', O: 'Computer' } : { X: 'Player X', O: 'Player O' };
    document.getElementById('lx').textContent = `${names.X} (X)`;
    document.getElementById('lo').textContent = `${names.O} (O)`;
    document.getElementById('vx').textContent = S.score.X;
    document.getElementById('vo').textContent = S.score.O;
    document.getElementById('vd').textContent = S.score.D;
    document.getElementById('sx').classList.toggle('active', !S.over && S.turn === 'X');
    document.getElementById('so').classList.toggle('active', !S.over && S.turn === 'O');

    const tag = (p) => `<span class="${p.toLowerCase()}">${p}</span>`;
    if (w && w.p === 'D') statusEl.innerHTML = 'A draw. Nobody gets the square.';
    else if (w) statusEl.innerHTML = cpuActive()
      ? (w.p === 'X' ? `You win with ${tag('X')}!` : `The computer wins with ${tag('O')}.`)
      : `${tag(w.p)} wins the round!`;
    else if (isCpuTurn()) statusEl.innerHTML = `Computer is thinking…`;
    else statusEl.innerHTML = cpuActive() ? `Your move, ${tag('X')}.` : `${tag(S.turn)} to move.`;

    Object.entries(modeBtns).forEach(([k, b]) => b.setAttribute('aria-pressed', String(S.mode === k)));
  }

  function play(i, byHuman) {
    if (S.over || S.board[i]) return;
    if (byHuman && isCpuTurn()) return;
    S.board[i] = S.turn;
    const w = winner(S.board);
    if (w) {
      S.over = true;
      S.score[w.p] += 1;
      // Loser starts the next round; on a draw, the other player starts.
      S.starter = w.p === 'D' ? (S.starter === 'X' ? 'O' : 'X') : (w.p === 'X' ? 'O' : 'X');
    } else {
      S.turn = S.turn === 'X' ? 'O' : 'X';
    }
    render(i);
    if (isCpuTurn()) setTimeout(cpuMove, 450);
  }

  function minimax(bd, player, depth) {
    const w = winner(bd);
    if (w) return w.p === 'O' ? 10 - depth : w.p === 'X' ? depth - 10 : 0;
    const scores = [];
    for (let i = 0; i < 9; i++) if (!bd[i]) {
      bd[i] = player; scores.push(minimax(bd, player === 'O' ? 'X' : 'O', depth + 1)); bd[i] = null;
    }
    return player === 'O' ? Math.max(...scores) : Math.min(...scores);
  }

  function bestMove() {
    const bd = S.board.slice();
    let best = -Infinity, moves = [];
    for (let i = 0; i < 9; i++) if (!bd[i]) {
      bd[i] = 'O'; const s = minimax(bd, 'X', 1); bd[i] = null;
      if (s > best) { best = s; moves = [i]; } else if (s === best) moves.push(i);
    }
    return moves[Math.floor(Math.random() * moves.length)];
  }

  function cpuMove() {
    if (!isCpuTurn()) return;
    const open = S.board.map((v, i) => v ? -1 : i).filter(i => i >= 0);
    // Normal mode slips up about a third of the time so it stays beatable.
    const i = S.mode === 'cpu' && Math.random() < 0.35 ? open[Math.floor(Math.random() * open.length)] : bestMove();
    play(i, false);
  }

  function newRound() {
    S.board = Array(9).fill(null); S.over = false; S.turn = S.starter;
    render();
    if (isCpuTurn()) setTimeout(cpuMove, 450);
  }

  function setMode(m) {
    if (S.mode === m) return;
    S.mode = m; S.score = { X: 0, O: 0, D: 0 }; S.starter = 'X';
    newRound();
  }

  modeBtns.cpu.addEventListener('click', () => setMode('cpu'));
  modeBtns.pvp.addEventListener('click', () => setMode('pvp'));
  modeBtns.hard.addEventListener('click', () => setMode('hard'));
  document.getElementById('again').addEventListener('click', newRound);
  document.getElementById('reset').addEventListener('click', () => { S.score = { X: 0, O: 0, D: 0 }; S.starter = 'X'; newRound(); });

  // Keypad layout: 7 8 9 on top, 1 2 3 on the bottom.
  const KEYMAP = { '7': 0, '8': 1, '9': 2, '4': 3, '5': 4, '6': 5, '1': 6, '2': 7, '3': 8 };
  document.addEventListener('keydown', (e) => {
    if (e.key in KEYMAP) play(KEYMAP[e.key], true);
    else if (e.key === 'n' || e.key === 'N') newRound();
  });

  function start(data) {
    S = data && data.S ? data.S : fresh();
    render();
    if (isCpuTurn()) setTimeout(cpuMove, 450);
  }
  window.claude?.hot?.snapshot?.(() => ({ S }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
